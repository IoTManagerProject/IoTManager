	${common_env_data.lib_deps_external_base}
	ESP32Async/ESPAsyncWebServer ;@^3.12.1
lib_deps_external_base = 
	bblanchon/ArduinoJson @6.18.0
	knolleary/PubSubClient
; Вариант веб-сервера здесь НЕ задаётся: единый переключатель LT_ASYNC_WEB_SERVER
; в include/Const.h. Пустая ссылка ${common_env_data.build_flags} в env безвредна —
; сюда можно добавлять будущие общие флаги.
build_flags = 

