[env:bk7231n]
; BK7231N на асинхронном стеке (ESPAsyncWebServer + AsyncWebSocket).
; Подробности и метрики: docs/articles/async-web-server.md (раздел 6.1).
; Нюансы:
;   1) На форке Mit4el/libretiny ESPAsyncWebServer 3.12.x НЕ собирается: в literals.h
;      используется ::emptyString, которого нет в форке (он есть в upstream >= 1.9.1).
;      Поэтому здесь форки ESPHome — их LibreTiny рекомендует для beken-72xx.
;   2) В esphome/ESPAsyncWebServer-esphome нет перегрузки
;      send(code, contentType, const uint8_t*, len) — учтено в src/AsyncWebServer.cpp.
;   3) LibreTiny не собирается глобальным PlatformIO 6.2.1b2 (beta) — нужен стабильный 6.1.x.
;   4) Вариант (async/standard) выбирается переключателем LT_ASYNC_WEB_SERVER в
;      include/Const.h — флаги -DASYNC_* в эту секцию не нужны. CONFIG_ASYNC_TCP_* здесь,
;      т.к. макросы должны видеть .cpp самой библиотеки AsyncTCP.
extra_scripts = 
	pre:tools/lt_fsbuild.py
	pre:tools/lt_fsflash.py
	pre:tools/version_bump.py
lib_compat_mode = off
lib_deps = 
	esphome/AsyncTCP-esphome @ ^2.0.0
	esphome/ESPAsyncWebServer-esphome @ ^3.0.0
	https://github.com/Mit4el/ESPAsyncUDP#master
	${common_env_data.lib_deps_external_base}
	${env:bk7231n_fromitems.lib_deps}
lib_ignore = EspSoftwareSerial, HTTPUpdate, WebSockets
platform = https://github.com/Mit4el/libretiny#master
framework = arduino
board = generic-bk7231n-qfn32-tuya
custom_fw_name = iotm_tiny
custom_fw_version = 0.0.1
upload_speed = 921600
monitor_speed = 115200
build_flags = 
	-Dbk7231n="bk7231n"
	-DLT_LOGLEVEL=LT_LEVEL_FATAL
	-DLT_DEBUG_ALL=1
	-DPROJECT_DATA_DIR="data_svelte"
	-DLT_USE_TIME=1
	-DDEBUG_ESP_PORT=Serial1
	-DNODEBUG_WEBSOCKETS=1
	-DLT_UART_DEFAULT_PORT=1
	-DUPLOAD_PORT=auto
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=32
	${env:bk7231n_fromitems.build_flags}
build_src_filter = 
	+<*.cpp>
	+<classes/*.cpp>
	+<utils/*.cpp>
	+<modules/*.cpp>
	${env:bk7231n_fromitems.build_src_filter}

